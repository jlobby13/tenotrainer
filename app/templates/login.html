{% extends "base.html" %}
{% block title %}Log In — TenoTrainer{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-xl shadow p-8 border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Log in to TenoTrainer</h1>
    <p class="text-sm text-gray-500 mb-6">Access your program plan and progress tracking.</p>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 focus:outline-none" />
      </div>
      <button type="submit"
              class="w-full py-2.5 bg-brand-600 text-white font-semibold rounded-lg hover:bg-brand-700 transition-colors">
        Log in
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-500">
      Don't have an account?
      <a href="/register" class="text-brand-600 font-medium hover:underline">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
